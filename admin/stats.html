<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowOS 通信統計</title><link rel="stylesheet" href="/style.css"><script src="/stats.js" defer></script></head>
<body><header><span class="brand">FLOW OS</span><h1>通信統計</h1><p>IPとサイトごとの通信量・リクエスト数</p><nav class="mode-tabs" aria-label="表示モード"><a href="/">ログ一覧</a><a href="/stats.html" aria-current="page">通信統計</a></nav></header>
<main><section class="controls"><label>日付（日本時間）<input type="date" id="day"></label><label>利用者のIP<select id="ip"><option value="">すべてのIP</option></select></label><label>サイトを絞り込み<input type="search" id="filter" placeholder="example.com"></label><button id="refresh">更新</button></section>
<p class="notice">アップロード＋ダウンロードを合算。1GB＝10億バイト。IPごとに1日3GB超過後は合計1Mbps。計測開始後の通信が対象です。</p><p id="status" role="status">読み込み中…</p>
<section class="metric-grid" aria-label="通信量の合計"><div class="metric"><span>合計通信量</span><strong id="total">—</strong></div><div class="metric"><span>アップロード</span><strong id="upload">—</strong></div><div class="metric"><span>ダウンロード</span><strong id="download">—</strong></div><div class="metric"><span>リクエスト</span><strong id="requests">—</strong></div></section>
<section class="stats-panel"><div class="panel-heading"><h2>IP別の通信量</h2><span>IPをクリックして詳細を表示</span></div><div class="table-scroll"><table><thead><tr><th>IPアドレス</th><th>リクエスト</th><th>アップロード</th><th>ダウンロード</th><th>合計</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="stats-panel"><h2>時間帯別の通信量（GB・日本時間）</h2><div id="hourly" class="hour-chart"></div></section>
<div class="chart-grid"><section class="stats-panel"><h2>サイト別の通信量（GB）</h2><div id="traffic-chart" class="bar-chart"></div></section><section class="stats-panel"><h2>サイト別のリクエスト数</h2><div id="request-chart" class="bar-chart"></div></section></div>
<section class="stats-panel"><h2>サイト別の内訳</h2><div class="table-scroll"><table><thead><tr><th>サイト</th><th>リクエスト</th><th>アップロード</th><th>ダウンロード</th><th>合計</th></tr></thead><tbody id="sites"></tbody></table></div></section></main></body></html>
