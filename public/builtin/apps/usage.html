<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ギガ確認</title><link rel="stylesheet" href="/styles/style.css"><link rel="stylesheet" href="/builtin/apps/styles/usage.css"><script src="/scripts/app.js" type="module"></script><script src="/builtin/apps/scripts/usage.js" type="module"></script></head>
<body><main><header><span class="eyebrow">FLOW OS · DATA</span><h1>ギガ確認</h1><p>このIPの本日のプロキシ通信量</p></header><section class="usage-card"><div class="usage-heading"><span>今日の使用量</span><span id="state">取得中</span></div><p class="usage-number"><strong id="used">—</strong> <span>/ 3 GB</span></p><progress id="meter" value="0" max="3" aria-label="本日の通信量"></progress><p id="remaining">読み込み中…</p><div class="usage-pair"><span>アップロード <b id="upload">—</b></span><span>ダウンロード <b id="download">—</b></span></div></section>
<section class="usage-info"><p>3GBを超えると、このIPのアップロード・ダウンロードの合計速度が1Mbpsになります。</p><p>日本時間の午前0時にリセットされます。同じIPを使う端末・タブは合算されます。</p><p id="reset"></p><p id="identity"></p></section><section><h2>アクセス先ごとの使用量</h2><div id="sites"></div></section><p id="updated" role="status"></p></main></body></html>
